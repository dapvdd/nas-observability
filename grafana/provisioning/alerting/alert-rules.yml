apiVersion: 1

groups:
  - orgId: 1
    name: davidlab-reliability
    folder: DavidLab
    interval: 1m
    rules:
      - uid: davidlab-target-down
        title: TargetDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up == bool 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              datasource: {type: prometheus, uid: prometheus}
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} / {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape this target for 2 minutes."

      - uid: davidlab-smb-probe-failed
        title: SmbProbeFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: probe_success{job="smb-probe"} == bool 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              datasource: {type: prometheus, uid: prometheus}
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 3m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "SMB TCP probe to {{ $labels.instance }} is failing"
          description: "blackbox tcp_connect returned 0 for 3m. Verify hostguard allowlist and smbd before declaring an SMB outage."

      - uid: davidlab-disk-high
        title: DiskUsageHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} * 100)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              datasource: {type: prometheus, uid: prometheus}
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - evaluator: {type: gt, params: [80]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 10m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem above 80%"
          description: "Root filesystem usage has exceeded 80% for 10 minutes."

      - uid: davidlab-disk-critical
        title: DiskUsageCritical
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} * 100)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              datasource: {type: prometheus, uid: prometheus}
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - evaluator: {type: gt, params: [90]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem above 90%"
          description: "Root filesystem usage has exceeded 90% for 5 minutes."
